   <text style="font-size: 8.5px; font-family: 'NanumGothic'; text-anchor: start; fill: #898781" x="7.2" y="333.388" transform="rotate(-0 7.2 333.388)">출처: 서울 열린데이터광장 지하철 호선별 역별 시간대별 승하차 인원(CardSubwayTime); 서울 열린데이터광장 버스노선별 정류장별 시간대별 승하차 인원(CardBusTimeNew); 서울 교통빅데이터플랫폼 소통정보</text>
