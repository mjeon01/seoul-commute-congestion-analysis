# 정책 시뮬레이션 가정값. 모든 값은 "가정"이며 실측이 아님 — 보고서에 그대로 표로 제시.
# 각 항목은 낮음/중간/높음 = 정책 효과가 작은 쪽 / 중간 / 큰 쪽.

peak_hours: {am: [8, 9], pm: [17, 18]}   # 원문 정의 (hour_start)

# 공통
car_share:        {low: 0.70, mid: 0.75, high: 0.80}   # 첨두 교통량 중 승용차 비중 — 서울시 교통량 조사 차종구성으로 보정 필요
occupancy:        {low: 1.2,  mid: 1.3,  high: 1.4}    # 승용차 재차인원(인/대)
to_transit_share: {low: 0.5,  mid: 0.6,  high: 0.7}    # 줄어든 승용차 통행 중 대중교통 전환 비율(나머지: 통행 취소·택시·카풀 등)

# 시나리오 B: 서울 전역 홀짝제 (원문: 출근 08~10, 퇴근 17~19)
odd_even:
  exempt_share:   {low: 0.30, mid: 0.20, high: 0.10}   # 예외 차량(영업용·장애인·긴급·친환경 등) 비중
  compliance:     {low: 0.60, mid: 0.80, high: 0.95}   # 순응률
  retime_share:   {low: 0.40, mid: 0.25, high: 0.10}   # 제한 차량 중 운행 시간을 바꿔 첨두 앞뒤 시간으로 이동하는 비율

# 시나리오 C: 혼잡지역 선택적 수요관리 (혼잡 자치구 한정)
selective:
  n_target_gu: 6                                        # 첨두 정체 연장비율 상위 자치구 수 (출근·퇴근 각각 선정)
  reduction:      {low: 0.10, mid: 0.15, high: 0.20}   # 대상지역 승용차 통행 감소율 — 출처 미확인 가정. 해외 혼잡통행료 사례·국내 자료로 검증 필요
  detour_share:   {low: 0.30, mid: 0.20, high: 0.10}   # 감소분 중 인접 자치구로 우회하는 비율

# 시나리오 D: 버스 증편 (추가 대중교통 수요 후보 자치구)
bus:
  n_target_gu: 8                                        # docs/eda_findings.md C06 상위 자치구
  car_reduction:  {low: 0.01, mid: 0.02, high: 0.04}   # 증편에 따른 승용차→버스 전환으로 인한 대상지역 승용차 통행 감소율
  added_capacity: 0.10                                  # 대상지역 첨두 버스 공급 증가율

# 속도 반응 모형
speed_model:
  # 방법 1: 지점 내 속도-교통량 탄력성(EDA D01, 06~21시, 지점 고정효과 로그-로그). 낮음/높음 = 부트스트랩 95% 구간 경계
  elasticity:
    도시고속도로: {low: -0.089, mid: -0.209, high: -0.462}   # 구간이 0을 포함 → 불확실
    주간선도로:   {low: -0.162, mid: -0.283, high: -0.465}
    보조간선도로: {low: -0.172, mid: -0.259, high: -0.412}
    기타도로:     {low: -0.172, mid: -0.259, high: -0.412}   # 지점 3개뿐 → 보조간선 값 사용
  # 방법 2: BPR 함수 t = t0 (1 + α (v/c)^β), 표준값(미국 BPR 1964)
  bpr: {alpha: 0.15, beta: 4}
  # 자유속도 t0: 링크별 00~05시 관측 최대속도 (상한: 제한속도)

# 혼잡 판정·잠재 초과수요
excess_threshold_pct: 10   # 자치구 첨두 대중교통 승차가 현재 대비 이 비율 이상 늘면 '잠재 초과수요 검토 필요'로 표시(가정)

# 대중교통 추가수요 산정용: 첨두 승용차 통행(인) / 대중교통 승차(인) 비율.
# 링크별 실제 교통량(대수)이 없어 자치구별 대중교통 승하차 실측에 이 비율을 곱해 승용차 통행 인원을 근사 — 서울시 수단분담률로 보정 필요
car_to_transit_ratio: {low: 0.3, mid: 0.4, high: 0.5}
