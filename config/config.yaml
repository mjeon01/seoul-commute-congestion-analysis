# 분석 공통 설정. 값을 바꾸면 전처리부터 다시 실행.

# 첨두 정의 (시작 시각 기준, hour_start). 원문 기준: 출근 08:00~10:00, 퇴근 17:00~19:00
peak:
  am: [8, 9]
  pm: [17, 18]
# TOPIS 소통정보 파일의 첨두 구분(T1=07~09시, T3=17~19시)은 비교용으로 원본 컬럼 유지

# 혼잡 판정 속도 기준 (km/h). TOPIS 소통 등급 기준 — 최종 보고서 전 공식 문서로 재확인 필요
congestion:
  urban_expressway: {jam: 30, slow: 70}   # 도시고속도로: <30 정체, 30~70 서행
  general: {jam: 15, slow: 25}            # 그 외 도로: <15 정체, 15~25 서행

# 좌표계
crs:
  analysis: 5179     # 통계청 경계(SGIS)와 동일, 미터 단위
  nodelink: 5186     # 표준노드링크 (ITRF2000 중부원점, FN 600000)
  volume_spot: 5181  # 교통량 지점 grs80tm (중부원점, FN 500000)
  web: 4326

seoul_sido_code: "11"
